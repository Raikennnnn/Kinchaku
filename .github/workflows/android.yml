# Builds the Android app (a Trusted Web Activity that opens the website full
# screen) and attaches the signed APK to each GitHub release as kinchaku.apk,
# which the website's "Download APK" button links to.
#
# Signing needs three repository secrets (Settings > Secrets and variables >
# Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_ALIAS. Without them, test builds still run but aren't signed.
name: Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event.release.tag_name || 'v0.0.0' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generate the Android project
        run: |
          npm ci --prefix android
          node android/generate.mjs "$VERSION" android/project

      - name: Build
        working-directory: android/project
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          UNSIGNED=android/project/app/build/outputs/apk/release/app-release-unsigned.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set: the APK isn't signed and can't be installed."
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "::error::A release needs a signed APK. Add the signing secrets, then re-run this workflow."
              exit 1
            fi
            cp aligned.apk kinchaku-unsigned.apk
            echo "apk=kinchaku-unsigned.apk" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kinchaku.keystore"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/kinchaku.keystore" --ks-key-alias "${KEY_ALIAS:-kinchaku}" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out kinchaku.apk aligned.apk
          rm -f "$RUNNER_TEMP/kinchaku.keystore"
          "$BUILD_TOOLS/apksigner" verify --print-certs kinchaku.apk | grep -i "SHA-256"
          echo "apk=kinchaku.apk" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" kinchaku.apk --clobber

      - name: Keep the test build
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: kinchaku-apk
          path: ${{ steps.sign.outputs.apk }}
          retention-days: 7
